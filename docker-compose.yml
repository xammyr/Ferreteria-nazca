version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ferreteria_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ferreteria_nazca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./datos.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
    driver: local
